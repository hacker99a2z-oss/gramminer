name: Cloud platform build checks

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "wrangler.jsonc"
      - "deno.json"
      - "backend/**"
      - "frontend/**"
      - "*.md"
      - ".github/workflows/cloud-platform-checks.yml"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "wrangler.jsonc"
      - "backend/**"
      - "frontend/**"
      - "*.md"
      - ".github/workflows/cloud-platform-checks.yml"

permissions:
  contents: read

jobs:
  deno-game-api:
    name: Check Deno game API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Deno game API
        run: deno task game-api:check
      - name: Test Deno game API route boundaries
        run: deno task game-api:test

  node-backend-rollback:
    name: Build Node payout and rollback image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Node backend container
        run: docker build --tag gramminer-node-backend:ci .

  cloudflare-worker:
    name: Bundle Cloudflare Workers backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle Worker without deploying
        run: npm run build:worker

  cloudflare-pages:
    name: Build and validate Cloudflare Pages frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend unit tests
        run: npm test
      - name: Build static frontend for Cloudflare Pages
        run: npm run build:pages
      - name: Validate Pages output
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          test ! -e dist/_worker.js
          test -d dist/assets
