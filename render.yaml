services:
  - type: web
    name: gramminer-backend
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: FRONTEND_URL
        value: https://gramminer-c68.pages.dev
      - key: FRONTEND_URLS
        value: https://gramminer-c68.pages.dev
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADSGRAM_REWARD_SECRET
        sync: false
      - key: PAYOUT_CRON_SECRET
        sync: false
      - key: TON_WALLET_MNEMONIC
        sync: false
      - key: TONCENTER_API_KEY
        sync: false
      - key: TON_WALLET_VERSION
        value: v5r1
      - key: PAYMENT_PROOF_CHAT_ID
        sync: false
      - key: PAYMENTS_PROOF_URL
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: BOT_APP_URL
        value: https://gramminer-c68.pages.dev
      - key: BOT_OFFICIAL_CHANNEL_URL
        sync: false
      - key: BOT_SUPPORT_GROUP_URL
        sync: false
      - key: TELEGRAM_AUTO_CONFIGURE_WEBHOOK
        value: "false"
